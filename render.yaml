services:
  - type: web
    name: prophecy-verse-v3-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
      - key: PORT
        value: 10000
      - key: PV_PROVIDER_MOVIEBOX_ENABLED
        value: "true"
      - key: PV_PROVIDER_ANIZONE_ENABLED
        value: "true"
      - key: PV_PROVIDER_DRAMACHI_ENABLED
        value: "true"
      - key: PV_PROVIDER_FOURKHDHUB_ENABLED
        value: "true"
