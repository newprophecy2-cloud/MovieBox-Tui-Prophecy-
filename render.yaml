services:
  - type: web
    name: moviebox-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
      - key: PORT
        value: 10000
      # Set this in the Render dashboard to enable shared Redis caching.
      # Without it, the backend safely falls back to its in-memory cache.
      - key: REDIS_URL
        sync: false
